*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0b0f1a;color:#e6e9f2}
.wrap{max-width:560px;margin:auto;padding:20px 16px 60px}
.hero{background:linear-gradient(135deg,#7f1d1d,#0b0b0b);border-radius:20px;padding:26px 20px;text-align:center;cursor:pointer;box-shadow:0 10px 30px #0006}
.hero .l{font-size:13px;opacity:.75;letter-spacing:.1em;text-transform:uppercase}.hero .v{font-size:46px;font-weight:800;margin:6px 0}.hero .h{font-size:12px;opacity:.6}
h2{font-size:14px;color:#8b93b0;text-transform:uppercase;letter-spacing:.1em;margin:28px 4px 10px}
.row{background:#121829;border:1px solid #1f2740;border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.bar{height:6px;background:#1f2740;border-radius:9px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f87171,#fb923c)}
.pos{color:#34d399}.neg{color:#f87171}.sub{font-size:12px;color:#8b93b0;font-weight:400}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sheet{background:#0f1424;width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 30px}
.sheet h3{margin:0 0 14px;display:flex;justify-content:space-between}.x{cursor:pointer;opacity:.6}
.line{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid #1a2138;font-size:14px}
.months{display:none;margin-top:8px}.open .months{display:block}

const fmt=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString();
function parse(t){return t.trim().split(/\r?\n/).slice(1).map(l=>{const p=l.split(','),m=(p[0]||'').trim().match(/(\d+)\/(\d+)\/(\d+)/),a=parseFloat((p[2]||'').replace(/[$\s,]/g,''));if(!m||isNaN(a))return null;return{date:m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0'),cat:p[1].trim(),amt:a,note:p.slice(3).join(',').trim()}}).filter(Boolean)}

let extra=JSON.parse(localStorage.getItem(KEY)||'[]');let data=parse(ORIGINAL);{const s=new Set(data.map(k));extra=extra.filter(r=>!s.has(k(r)));data=data.concat(extra)}
function readFile(f){if(!f)return;const R=new FileReader();R.onload=e=>{const s=new Set(data.map(k));let n=0;parse(e.target.result).forEach(r=>{if(!s.has(k(r))){s.add(k(r));data.push(r);extra.push(r);n++}});localStorage.setItem(KEY,JSON.stringify(extra));$('msg').textContent='Added '+n+' new entries.';render()};R.readAsText(f)}
function resetData(){if(confirm('Remove added data and go back to the original?')){localStorage.removeItem(KEY);extra=[];data=parse(ORIGINAL);render()}}

 open_('<h3>'+n+' <span class="x" onclick="close_()">✕</span></h3><div class="sub" style="margin-bottom:12px">'+rs.length+' expenses · total <span class="neg">'+fmt(tot)+'</span></div>'+Object.keys(g).map(m=>'<h2 style="margin:16px 4px 4px">'+MN[+m.slice(5)-1]+' '+m.slice(0,4)+' · '+fmt(g[m].reduce((s,r)=>s+r.amt,0))+'</h2>'+g[m].map(r=>'<div class="line"><span>'+dt(r.date)+(r.note?'<br><span class="sub">'+r.note+'</span>':'')+'</span><b class="neg">'+fmt(r.amt)+'</b></div>').join('')).join(''))}

 +'<h2>Entries</h2>'+rs.map(r=>'<div class="line"><span>'+dt(r.date)+' · '+r.cat+(r.note?'<br><span class="sub">'+r.note+'</span>':'')+'</span><b class="'+cls(r.amt)+'">'+fmt(r.amt)+'</b></div>').join(''))}
